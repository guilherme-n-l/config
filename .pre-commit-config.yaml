# Format + lint nix, shell, lua, python, and markdown. Tools come from the
# flake devShell (`nix develop`); the git hook is installed by its shellHook.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # ---- nix ----
      - id: nixfmt
        name: nixfmt
        language: system
        entry: nixfmt
        types: [nix]

      - id: deadnix
        name: deadnix
        language: system
        entry: deadnix --edit --fail
        types: [nix]

      # ---- shell ----
      - id: shfmt
        name: shfmt
        language: system
        entry: shfmt -w -i 2 -ci
        types: [shell]
        exclude: (^|/)\.zshrc$

      - id: shellcheck
        name: shellcheck
        language: system
        entry: shellcheck --severity=warning
        types: [shell]
        exclude: (^|/)\.zshrc$

      # ---- lua ----
      - id: stylua
        name: stylua
        language: system
        entry: stylua
        types: [lua]

      # ---- python ----
      - id: ruff-format
        name: ruff-format
        language: system
        entry: ruff format
        types: [python]

      - id: ruff
        name: ruff
        language: system
        entry: ruff check --fix
        types: [python]

      # ---- markdown / json / yaml ----
      # prettier's json parser keeps `//` comments, which the klfc layout
      # files under modules/programs/keyboard/layouts are allowed to use.
      - id: prettier
        name: prettier
        language: system
        entry: prettier --write
        types_or: [markdown, json, yaml]
        exclude: ^flake\.lock$
